[project]
name = "routesafe-api"
version = "0.1.0"
description = "Weather-aware truck route analysis API"
requires-python = ">=3.12"
dependencies = [
  "Django>=6.0,<6.2",
  "djangorestframework>=3.16,<4",
  "django-cors-headers>=4.7,<5",
  "gunicorn>=23,<24",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-django>=4.10,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["route_analysis/tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["config*", "route_analysis*"]
