name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
      - run: python manage.py check --deploy
        working-directory: backend
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-secret-key-with-at-least-fifty-characters-and-enough-entropy-92741
          DJANGO_ALLOWED_HOSTS: localhost
          FRONTEND_ORIGINS: http://localhost:5173
